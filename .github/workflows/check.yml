name: Check

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package and saved evidence
        run: python3 scripts/check.py
      - name: Check evidence rejection regressions
        run: python3 -m unittest discover -s tests -p "test_*.py"
